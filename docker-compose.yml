services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: heuristix-hub:latest
    container_name: heuristix-hub
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    env_file:
      - .env
    ports:
      - "8000:8000"   # FastAPI
      - "8501:8501"   # Streamlit UI
    volumes:
      - ./hub/workspace:/app/hub/workspace
      - ./runs:/app/runs
    restart: unless-stopped
