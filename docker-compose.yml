services:
  dashboard:
    build:
      context: ./dashboard
    image: heuristix-dashboard:latest
    container_name: heuristix-dashboard
    env_file:
      - .env            # OPENAI_API_KEY, OPENAI_MODEL
    ports:
      - "5000:5000"
    volumes:
      - ./dashboard/results:/app/results
      - ./dashboard/benchmarks:/app/benchmarks
    restart: unless-stopped
