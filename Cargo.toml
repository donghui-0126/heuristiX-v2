[package]
name = "heuristix"
version = "0.2.0"
edition = "2021"
description = "DES simulator for dynamic job shop scheduling under supply-chain disruption"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evalexpr = "11"
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bin]]
name = "heuristix"
path = "src/main.rs"
